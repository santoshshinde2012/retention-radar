# TEMPORARY: trains the published seed-42 bundle on Linux x86-64 (the CI platform,
# where `make reproduce` must match exactly) and uploads it. Removed once committed.
name: train-bundle

on:
  push:
    branches: [feat/coding-assistant-renewal-v2]
    paths: [.github/workflows/train-bundle.yml]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Train + evaluate + analysis (N=8000, 20 trials)
        env:
          CHURN_DATA_SOURCE: synthetic
          N_USERS: "8000"
          N_OPTUNA_TRIALS: "20"
        run: |
          ./scripts/run_all.sh
          python -m retention_radar.cli.build_use_cases
          make docs-results
          python - <<'PY'
          import json
          p = json.load(open("artifacts/maya_decision_packet.json"))
          for k, v in p["meta"].items():
              if isinstance(v, str) and "/retention-radar/" in v:
                  p["meta"][k] = v.split("/retention-radar/")[1]
          json.dump(p, open("results/maya_decision_packet.sample.json", "w"), indent=2)
          PY
      - name: Lakehouse E2E (same-named lakehouse branch)
        run: |
          git clone --depth 1 --branch feat/coding-assistant-renewal-v2 https://github.com/santoshshinde2012/local-data-lakehouse.git "$RUNNER_TEMP/ldl"
          PYTHON=$(command -v python) ./scripts/run_lakehouse_e2e.sh "$RUNNER_TEMP/ldl"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            models/
            docs/MODEL_CARD.md
            docs/data/data-dictionary.md
            results/
            data/use_cases/
            data/raw/subscribers/
            artifacts/arjun_decision_packet.json
            artifacts/maya_decision_packet.json
            artifacts/xgb_feature_importance.csv
