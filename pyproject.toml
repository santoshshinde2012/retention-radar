[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-radar"
version = "0.1.0"
description = "FOSS Retention Radar: XGBoost AI-platform churn teaching case (synthetic data, HITL)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Santosh Shinde" }]

[project.scripts]
rr-train = "retention_radar.cli.train:main"
rr-evaluate = "retention_radar.cli.evaluate:main"
rr-infer = "retention_radar.cli.infer:main"
rr-single-record = "retention_radar.cli.single_record:main"
rr-generate-data = "retention_radar.cli.generate_data:main"
rr-ingest = "retention_radar.cli.ingest:main"
rr-benchmark = "retention_radar.cli.benchmark:main"
rr-drift-check = "retention_radar.cli.drift_check:main"
rr-explain = "retention_radar.cli.explain:main"
rr-slice-metrics = "retention_radar.cli.slice_metrics:main"
rr-docs-gen = "retention_radar.cli.docs_gen:main"
rr-batch-score = "retention_radar.cli.batch_score:main"
rr-hitl-log = "retention_radar.cli.hitl_log:main"
rr-hitl-outcomes = "retention_radar.cli.hitl_outcomes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
